# TEMPORARY (removed in the next commit): regenerates docs/api/openapi.runtime.v1.json because the maintainer PC has no fastapi.
name: tmp-openapi
on:
  push:
    branches: [l4-job-subtitles]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - run: python ai_creator_studio_backend_starter/scripts/export_runtime_openapi.py --output "$RUNNER_TEMP/openapi.runtime.v1.json"
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-snapshot
          path: ${{ runner.temp }}/openapi.runtime.v1.json
          retention-days: 1
