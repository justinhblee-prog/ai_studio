name: tmp-openapi
on:
  push:
    branches: [l6-members]
jobs:
  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - working-directory: ai_creator_studio_backend_starter
        run: python scripts/export_runtime_openapi.py --output ../openapi_generated.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi_generated.json
