name: tmp-scale
on:
  push:
    branches: [r076-scale]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - working-directory: ai_creator_studio_backend_starter
        run: python scripts/scale_probe.py --items 2000 --work 2000 --reviews 10000 --repeat 2
