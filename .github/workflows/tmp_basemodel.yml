name: tmp-basemodel
on:
  push:
    branches: [l2-apose]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: ai_creator_studio_3d_viewer
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          for f in male female; do node scripts/render_glb.mjs --glb ../design_assets/base_models/base_$f.glb --out /tmp/bmout/$f --size 512 --angles 4 --elevation 5; done
      - uses: actions/upload-artifact@v4
        with:
          name: bm
          path: /tmp/bmout
