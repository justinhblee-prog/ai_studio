name: tmp-gltfmeasure
on:
  push:
    branches: [l1-gltf-transform-measure]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python ai_creator_studio_backend_starter/scripts/make_sample_glb.py /tmp/samples
      - working-directory: tools/gltf_compress
        run: |
          npm ci
          npx --no-install gltf-transform --version
          bash ./measure.sh /tmp/samples /tmp/out | tee /tmp/table.md
          echo "=== inspect meshopt_webp"; npx --no-install gltf-transform inspect /tmp/out/sphere_hi__meshopt_webp.glb | head -40
          echo "=== validate"; npx --no-install gltf-transform validate /tmp/out/sphere_hi__meshopt_webp.glb | head -20
          cd ../../ai_creator_studio_backend_starter && python - <<'PY'
          import glob, os
          from app.glb_tools import inspect_glb
          for p in sorted(glob.glob("/tmp/samples/*.glb") + glob.glob("/tmp/out/*.glb")):
              i = inspect_glb(open(p, "rb").read()); print("TRI", os.path.basename(p), i["file_bytes"], i["triangles"], i["images"], i["size"])
          PY
