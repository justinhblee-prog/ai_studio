name: tmp-basemodel
on:
  push:
    branches: [l2-base-models]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          cd ai_creator_studio_backend_starter && mkdir -p /tmp/bm && python - <<'PY'
          from app.base_models import build_base_model
          open("/tmp/bm/male.glb", "wb").write(build_base_model("male", top_style="tshirt", bottom_style="pants", top=(200, 60, 60), bottom=(40, 60, 120)))
          open("/tmp/bm/female.glb", "wb").write(build_base_model("female", top_style="longsleeve", bottom_style="shorts", top=(240, 220, 120), bottom=(30, 30, 30)))
          PY
      - working-directory: ai_creator_studio_3d_viewer
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          for f in male female; do node scripts/render_glb.mjs --glb /tmp/bm/$f.glb --out /tmp/bmout/$f --size 512 --angles 4 --elevation 5; done
      - uses: actions/upload-artifact@v4
        with:
          name: bm
          path: /tmp/bmout
