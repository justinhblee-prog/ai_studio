# B-02: the backup / restore drill (R-077) run on a schedule, so a backup that cannot be restored is found within a week - not on the day it is needed.
# It only works on a throw-away demo environment built inside the job: no production data, no Supabase/Vercel, no secret. The pull request that changes the drill runs it once as well.
# If a SCHEDULED run fails it opens (or comments on) one issue, so the failure reaches the people who watch the repository; see docs/RESTORE_DRILL.md "정기 실행과 알림 경로".
name: restore-drill
on:
  schedule:
    - cron: "7 19 * * 0"       # Sunday 19:07 UTC = Monday 04:07 in Seoul
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/restore-drill.yml"
      - "ai_creator_studio_backend_starter/scripts/restore_drill.py"
      - "ai_creator_studio_backend_starter/scripts/backup_restore.py"
      - "ai_creator_studio_backend_starter/scripts/drill_report.py"
permissions:
  contents: read
  issues: write
jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai_creator_studio_backend_starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai_creator_studio_backend_starter/requirements.txt
      - run: pip install -r requirements.txt
      - name: Drill on the small and the scale demo environments
        run: |
          mkdir -p reports
          python scripts/restore_drill.py --demo small --out reports/small.json > /dev/null
          python scripts/restore_drill.py --demo scale --out reports/scale.json > /dev/null
      - name: "Summary and the RTO budget (a proposal: 30 s on this runner; measured 2.2 s at R-077)"
        if: always()
        run: python scripts/drill_report.py reports/small.json reports/scale.json --max-rto 30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the drill reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-reports
          path: ai_creator_studio_backend_starter/reports
          if-no-files-found: warn
          retention-days: 30
      - name: Tell the people who watch the repository (scheduled runs only)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/drill_report.py reports/small.json reports/scale.json --max-rto 30 --issue-body --run-url "$RUN_URL" > issue.md || true
          title="Restore drill failed (weekly check)"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue comment "$number" --body-file issue.md; else gh issue create --title "$title" --body-file issue.md; fi
