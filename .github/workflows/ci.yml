# Clean-checkout verification. DRAFT: written and its commands run locally, but this workflow
# has not been executed on GitHub. Uses a throwaway PostgreSQL service only; no Supabase,
# Vercel, paid Provider, or secret is used or required.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: acs_live
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
      ACS_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/acs_live
    defaults:
      run:
        working-directory: ai_creator_studio_backend_starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai_creator_studio_backend_starter/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests scripts
      - name: Prepare Supabase-compatible roles (stubs for the disposable CI database)
        run: >-
          psql -h localhost -U postgres -d acs_live -v ON_ERROR_STOP=1 -c
          "create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;
          create schema auth; create function auth.uid() returns uuid language sql stable as 'select null::uuid';"
      - name: pytest (unit + live PostgreSQL repository tests)
        run: |
          set -o pipefail
          python -m pytest -q --no-header -p no:cacheprovider | tee pytest.txt
      - name: Live tests must not be silently skipped
        run: |
          set -o pipefail
          python -m pytest -q --no-header -p no:cacheprovider tests/test_postgres_live_repositories.py -rs | tee live.txt
          ! grep -qE "[0-9]+ (skipped|failed)" live.txt
      - name: Keep the pytest logs for the release evidence page (R-031)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend
          path: |
            ai_creator_studio_backend_starter/pytest.txt
            ai_creator_studio_backend_starter/live.txt
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai_creator_studio_3d_viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_creator_studio_3d_viewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Source and unit tests
        run: |
          set -o pipefail
          npm run test:source | tee frontend.txt
      - run: npm run build
      - name: Keep the frontend log for the release evidence page (R-031)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-frontend
          path: ai_creator_studio_3d_viewer/frontend.txt
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Browser E2E: local SQLite backend (PROVIDER_MODE=mock, no external provider) + the release web build.
    # Supabase Auth is mocked inside the browser; no Supabase, Vercel or paid provider is contacted.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [a, b]   # the browser flows are split in two parallel jobs (they took 20 minutes in one)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_creator_studio_3d_viewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai_creator_studio_backend_starter/requirements.txt
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - name: Install web dependencies and the pinned Playwright browser
        working-directory: ai_creator_studio_3d_viewer
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Build the release web bundle (fixed API address, mocked Supabase address)
        working-directory: ai_creator_studio_3d_viewer
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8765
          VITE_ASSET_PUBLIC_BASE_URL: https://api.e2e.test
          VITE_SUPABASE_URL: https://e2e-mock.supabase.test
          VITE_SUPABASE_ANON_KEY: e2e-anon-not-a-secret
        run: npm run build
      - name: Pilot flow
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/pilot_flow.mjs | tee e2e.txt
          grep -q "SUMMARY 10/10 steps passed" e2e.txt
      - name: Rights declaration flow (L-04, enforcement on)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/rights_flow.mjs | tee e2e_rights.txt
          grep -q "SUMMARY 6/6 rights steps passed" e2e_rights.txt
      - name: Try-on generation start screen (R-026, mock provider)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/generation_flow.mjs | tee e2e_generation.txt
          grep -q "SUMMARY 9/9 generation steps passed" e2e_generation.txt
      - name: Default asset library screen and pickers (R-033)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/library_flow.mjs | tee e2e_library.txt
          grep -q "SUMMARY 7/7 library steps passed" e2e_library.txt
      - name: Expired login asks again on top of the screen (R-030 A)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/session_flow.mjs | tee e2e_session.txt
          grep -q "SUMMARY 3/3 session steps passed" e2e_session.txt
      - name: Korean error messages for 503, 429 and a lost connection (R-030 B)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/errors_flow.mjs | tee e2e_errors.txt
          grep -q "SUMMARY 5/5 error message steps passed" e2e_errors.txt
      - name: Roles, workspace isolation and mobile width
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/roles_flow.mjs | tee e2e_roles.txt
          grep -q "SUMMARY 6/6 role scenarios passed" e2e_roles.txt
      - name: AI generated disclosure on provider outputs (L-07)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/disclosure_flow.mjs | tee e2e_disclosure.txt
          grep -q "SUMMARY 5/5 disclosure steps passed" e2e_disclosure.txt
      - name: Responsive layout, no sideways scrolling (360-1280 px)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/layout_flow.mjs | tee e2e_layout.txt
          grep -q "SUMMARY 13/13 layout checks passed" e2e_layout.txt
      - name: Legal acceptance gate, AI-training consent and deletion requests in the browser
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          mkdir -p e2e_screens
          E2E_SCREENSHOT_DIR=e2e_screens node e2e/legal_flow.mjs | tee e2e_legal.txt
          grep -q "SUMMARY 8/8 legal screen steps passed" e2e_legal.txt
      - name: Keep the legal modal screenshots (looked at by hand, not asserted)
        if: always() && matrix.group == 'b'
        uses: actions/upload-artifact@v4
        with:
          name: legal-modal-screens
          path: ai_creator_studio_3d_viewer/e2e_screens
          if-no-files-found: ignore
          retention-days: 7
      - name: Account and data-protection API flows (legal, deletion requests, Character guard)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/account_flow.mjs | tee e2e_account.txt
          grep -q "SUMMARY 4/4 account flow steps passed" e2e_account.txt
      - name: UI audit report (R-030, prints findings, never fails the build)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        continue-on-error: true
        run: |
          node e2e/audit_flow.mjs | tee audit_report.txt
      - name: Keep the e2e logs for the release evidence page (R-031)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-e2e-${{ matrix.group }}
          path: ai_creator_studio_3d_viewer/e2e*.txt
          if-no-files-found: ignore
          retention-days: 14

  evidence:
    # R-031: one Markdown page with the commit, the counts from the three jobs and the launch flags. Reads logs only.
    needs: [backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: evidence_logs
          merge-multiple: true
      - name: Build the evidence page
        run: |
          python ai_creator_studio_backend_starter/scripts/release_evidence.py --logs-dir evidence_logs --commit "$GITHUB_SHA" --out release_evidence.md
          cat release_evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release_evidence.md
          retention-days: 30
