          type: boolean
        preserve_product_geometry:
          type: boolean
        preserve_text_and_logo:
          type: boolean
        target_style:
          type: string
        output_format:
          type: string
          enum:
          - PNG
          - JPEG
          - WEBP
    JobCreateRequest:
      type: object
      required:
      - workspace_id
      - feature_code
      - quote_id
      - feature_input
