name: tmp-flake
on:
  push:
    branches: [fix-901-overflow]
jobs:
  flake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - working-directory: ai_creator_studio_3d_viewer
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - working-directory: ai_creator_studio_3d_viewer
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8765
          VITE_ASSET_PUBLIC_BASE_URL: https://api.e2e.test
          VITE_SUPABASE_URL: https://e2e-mock.supabase.test
          VITE_SUPABASE_ANON_KEY: e2e-anon-not-a-secret
        run: npm run build
      - working-directory: ai_creator_studio_3d_viewer
        run: |
          for suffix in dddddddd bbbbbbbb 88888888 00000000 deadbeef c0ffee11 abcdef01 9999aaaa; do
            if E2E_WS_SUFFIX=$suffix node e2e/layout_flow.mjs > run_$suffix.txt 2>&1; then echo "suffix $suffix ok"; else echo "suffix $suffix FAILED"; grep -E "^FAIL|horizontal overflow" run_$suffix.txt | head -6 | cut -c1-400; fi
          done
