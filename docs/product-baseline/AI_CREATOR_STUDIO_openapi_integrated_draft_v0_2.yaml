        project_id:
          $ref: '#/components/schemas/NullableIdentifier'
        quote_id:
          $ref: '#/components/schemas/Identifier'
        current_execution_id:
          $ref: '#/components/schemas/NullableIdentifier'
        cancel_requested_at:
          $ref: '#/components/schemas/NullableTimestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    JobResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/GenerationJob'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
