name: tmp-bgeval
on:
  push:
    branches: [l3-bg-removal]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - working-directory: ai_creator_studio_backend_starter
        run: |
          python scripts/bg_eval.py
          python - <<'PY'
          from app import bg_removal as bg
          for c in bg.evaluation_set():
              print("CONF", c["name"], bg.removal_confidence(c["image"], "auto"))
          import PIL.Image as I
          print("CONF noisy-flood", bg.removal_confidence(I.effect_noise((96, 96), 90).convert("RGB"), "flood"))
          print("CONF flat", bg.removal_confidence(I.new("RGB", (64, 64), (240, 240, 240)), "auto"))
          PY
