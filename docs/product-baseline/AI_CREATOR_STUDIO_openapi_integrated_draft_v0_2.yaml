openapi: 3.1.0
info:
  title: AI CREATOR STUDIO API
  version: 0.2.0
  description: 'Integrated OpenAPI 3.1.0 draft for AI CREATOR STUDIO core APIs. Design contract only: API prefix,
    authentication, physical identifiers, persistence, and deployment URLs remain subject to repository audit and
    approval.'
servers:
- url: https://api.example.invalid
  description: Placeholder only; production server and API prefix are undecided.
tags:
- name: Projects
- name: Assets
- name: Quotes
- name: GenerationJobs
- name: Executions
- name: Events
- name: Outputs
- name: Credits
paths:
  /assets:
    post:
      tags:
      - Assets
      operationId: createAsset
      summary: Register an uploaded asset
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '201':
          description: Asset registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /assets/{asset_id}:
    get:
      tags:
      - Assets
      operationId: getAsset
      summary: Retrieve an asset visible to the caller
      parameters:
      - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /quotes:
    post:
      tags:
      - Quotes
      operationId: createQuote
      summary: Calculate a generation quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
      responses:
        '200':
          description: Quote calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/PolicyRejected'
  /generation-jobs:
    post:
      tags:
      - GenerationJobs
      operationId: createGenerationJob
      summary: Create an asynchronous generation job
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
    get:
      tags:
      - GenerationJobs
      operationId: listGenerationJobs
      summary: List generation jobs in a workspace
      parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /generation-jobs/{job_id}:
    get:
      tags:
      - GenerationJobs
      operationId: getGenerationJob
      summary: Retrieve a generation job
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /generation-jobs/{job_id}/cancel:
    post:
      tags:
      - GenerationJobs
      operationId: cancelGenerationJob
      summary: Request cancellation of a generation job
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation request accepted; provider cancellation may be asynchronous
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /generation-jobs/{job_id}/outputs:
    get:
      tags:
      - GenerationJobs
      operationId: listGenerationJobOutputs
      summary: List persisted outputs for a job
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Persisted outputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /credits/accounts/{account_id}:
    get:
      tags:
      - Credits
      operationId: getCreditAccount
      summary: Retrieve credit account balance
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Credit account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    post:
      tags:
      - Projects
      operationId: createProject
      summary: Create a project in a workspace
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Projects
      operationId: listProjects
      summary: List projects visible in a workspace
      parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{project_id}:
    get:
      tags:
      - Projects
      operationId: getProject
      summary: Retrieve a project
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /generation-jobs/{job_id}/executions:
    get:
      tags:
      - Executions
      operationId: listGenerationJobExecutions
      summary: List execution attempts
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List execution attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /generation-jobs/{job_id}/events:
    get:
      tags:
      - Events
      operationId: listGenerationJobEvents
      summary: List job state and execution events
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List job state and execution events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEventListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/ProviderBadResponse'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /credits/accounts/{account_id}/ledger:
    get:
      tags:
      - Credits
      operationId: listCreditLedgerEntries
      summary: List append-only credit ledger entries
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Credit ledger page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLedgerListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for mutating operations that create jobs, reserve/alter credits, or request cancellation.
        Scope, request-hash canonicalization, and TTL remain implementation decisions.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PolicyRejected:
      description: Request rejected by policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderBadResponse:
      description: Provider returned an invalid response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderTimeout:
      description: Provider response timed out; execution outcome may be unknown
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Identifier:
      type: string
      minLength: 1
      description: Opaque identifier; physical format TBD.
    Timestamp:
      type: string
      format: date-time
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
        correlation_id:
          type: string
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
        code:
          type: string
    ErrorBody:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - FORBIDDEN
          - RESOURCE_NOT_FOUND
          - RESOURCE_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - JOB_NOT_CANCELLABLE
          - INSUFFICIENT_CREDITS
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - POLICY_REJECTED
          - RATE_LIMITED
          - INTERNAL_ERROR
          - PROVIDER_BAD_RESPONSE
          - SERVICE_UNAVAILABLE
          - PROVIDER_TIMEOUT
          - ASSET_NOT_READY
          - ASSET_ACCESS_DENIED
          - QUOTE_EXPIRED
          - QUOTE_ALREADY_CONSUMED
          - PROVIDER_AUTH_FAILED
          - PROVIDER_CAPACITY_EXCEEDED
          - PROVIDER_RESULT_UNKNOWN
          - OUTPUT_PERSISTENCE_FAILED
          - CREDIT_RESERVATION_FAILED
          - CREDIT_RECONCILIATION_REQUIRED
        message:
          type: string
        retryable:
          type: boolean
        retry_after_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AssetCreateRequest:
      type: object
      required:
      - workspace_id
      - asset_type
      - display_name
      - upload_reference
      properties:
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        project_id:
          $ref: '#/components/schemas/NullableIdentifier'
        asset_type:
          type: string
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        upload_reference:
          type: string
          description: Short-lived upload reference; not a storage key.
    Asset:
      type: object
      required:
      - id
      - workspace_id
      - asset_type
      - status
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        project_id:
          $ref: '#/components/schemas/NullableIdentifier'
        asset_type:
          type: string
          enum:
          - IMAGE
          - VIDEO
          - MODEL_3D
          - DOCUMENT
          - OTHER
        display_name:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - READY
          - REJECTED
          - DELETED
          description: Asset processing and availability state.
        current_version_id:
          $ref: '#/components/schemas/NullableIdentifier'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AssetResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Asset'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    QuoteCreateRequest:
      type: object
      required:
      - workspace_id
      - feature_code
      - feature_input
      properties:
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        feature_code:
          type: string
          enum:
          - TRY_ON
          - PHOTO
          - LOOKBOOK
        feature_input:
          oneOf:
          - $ref: '#/components/schemas/TryOnInput'
          - $ref: '#/components/schemas/PhotoInput'
          - $ref: '#/components/schemas/LookbookInput'
        routing:
          $ref: '#/components/schemas/RoutingRequest'
    Quote:
      type: object
      required:
      - id
      - workspace_id
      - feature_code
      - estimated_credits
      - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        feature_code:
          type: string
        estimated_credits:
          type: integer
          minimum: 0
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    QuoteResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Quote'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RoutingRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
          - AUTO
          - MANUAL
          default: AUTO
        provider_id:
          type:
          - string
          - 'null'
        model_id:
          type:
          - string
          - 'null'
      description: MANUAL routing must not automatically fall back. AUTO fallback is permitted only under an approved
        capability/policy decision.
    TryOnInput:
      type: object
      required:
      - source_asset_id
      - person_asset_id
