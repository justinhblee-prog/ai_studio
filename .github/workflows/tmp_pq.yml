name: tmp-pq
on:
  push:
    branches: [l3-photo-quality]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - working-directory: ai_creator_studio_backend_starter
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          from PIL import ImageFilter
          from app import photo_quality as pq
          import importlib.util
          spec = importlib.util.spec_from_file_location("t", "tests/test_photo_quality.py"); t = importlib.util.module_from_spec(spec); spec.loader.exec_module(t)
          sharp = t.on_white(t.textured(300, 300))
          for r in (0, 1, 2, 3, 5, 9, 14):
              pic = sharp if r == 0 else sharp.filter(ImageFilter.GaussianBlur(r))
              rep = pq.check_image(pic, background="white")
              print("SHARP", r, [c["value"] for c in rep["checks"] if c["name"] == "sharpness"], rep["failed"], rep["warnings"])
          for size in (120, 200, 300, 500):
              rep = pq.check_image(t.on_white(t.textured(size, size)), background="white")
              print("SIZE", size, [c["value"] for c in rep["checks"] if c["name"] == "sharpness"])
          PY
