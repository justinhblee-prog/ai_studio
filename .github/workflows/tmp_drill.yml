name: tmp-drill
on:
  push:
    branches: [r077-restore-drill]
jobs:
  drill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - working-directory: ai_creator_studio_backend_starter
        run: |
          python scripts/restore_drill.py --demo small
          python scripts/restore_drill.py --demo scale
