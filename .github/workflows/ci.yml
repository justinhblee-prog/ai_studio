# Clean-checkout verification. DRAFT: written and its commands run locally, but this workflow
# has not been executed on GitHub. Uses a throwaway PostgreSQL service only; no Supabase,
# Vercel, paid Provider, or secret is used or required.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: acs_live
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
      ACS_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/acs_live
    defaults:
      run:
        working-directory: ai_creator_studio_backend_starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai_creator_studio_backend_starter/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests scripts
      - name: Docs index is complete (B-20)
        run: python scripts/docs_check.py --check
      - name: The one-command local start works in mock mode and says how long it took (B-21)
        run: python scripts/dev_up.py --selftest
      - name: Install ffmpeg and the open Korean subtitle font (Lane 4 / E-08a, E-08c; the tests fail, not skip, if it is missing)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk && ffmpeg -version | head -n 1 && fc-list | grep -c NotoSansCJK
      - name: Keep the font package's own licence text (copyright file) for docs/THIRD_PARTY_FONTS.md
        run: |
          cp /usr/share/doc/fonts-noto-cjk/copyright font_license_noto_cjk.txt
          dpkg-query -W fonts-noto-cjk > font_package_version.txt
      - name: Prepare Supabase-compatible roles (stubs for the disposable CI database)
        run: >-
          psql -h localhost -U postgres -d acs_live -v ON_ERROR_STOP=1 -c
          "create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;
          create schema auth; create function auth.uid() returns uuid language sql stable as 'select null::uuid';"
      - name: pytest (unit + live PostgreSQL repository tests)
        env:
          REQUIRE_FFMPEG: "1"
          REQUIRE_SUBTITLE_FONT: "1"
          VIDEO_MATRIX_OUT: video_matrix.md
        run: |
          set -o pipefail
          python -m pytest -q --no-header -p no:cacheprovider --durations=25 | tee pytest.txt
      - name: MP4 matrix measured in this run (Lane 4 / E-08a)
        run: cat video_matrix.md
      - name: Live tests must not be silently skipped
        run: |
          set -o pipefail
          python -m pytest -q --no-header -p no:cacheprovider tests/test_postgres_live_repositories.py -rs | tee live.txt
          ! grep -qE "[0-9]+ (skipped|failed)" live.txt
      - name: Keep the pytest logs for the release evidence page (R-031)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend
          path: |
            ai_creator_studio_backend_starter/pytest.txt
            ai_creator_studio_backend_starter/live.txt
            ai_creator_studio_backend_starter/video_matrix.md
            ai_creator_studio_backend_starter/font_license_noto_cjk.txt
            ai_creator_studio_backend_starter/font_package_version.txt
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai_creator_studio_3d_viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_creator_studio_3d_viewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Source and unit tests
        run: |
          set -o pipefail
          npm run test:source | tee frontend.txt
      - run: npm run build
      - name: Keep the frontend log for the release evidence page (R-031)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-frontend
          path: ai_creator_studio_3d_viewer/frontend.txt
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Browser E2E: local SQLite backend (PROVIDER_MODE=mock, no external provider) + the release web build.
    # Supabase Auth is mocked inside the browser; no Supabase, Vercel or paid provider is contacted.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [a, b]   # the browser flows are split in two parallel jobs (they took 20 minutes in one)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_creator_studio_3d_viewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai_creator_studio_backend_starter/requirements.txt
      - run: pip install -r ai_creator_studio_backend_starter/requirements.txt
      - name: Install web dependencies and the pinned Playwright browser
        working-directory: ai_creator_studio_3d_viewer
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Build the release web bundle (fixed API address, mocked Supabase address)
        working-directory: ai_creator_studio_3d_viewer
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8765
          VITE_ASSET_PUBLIC_BASE_URL: https://api.e2e.test
          VITE_SUPABASE_URL: https://e2e-mock.supabase.test
          VITE_SUPABASE_ANON_KEY: e2e-anon-not-a-secret
        run: npm run build
      - name: Server-side render of a synthetic .glb (E-02 step 1, headless Chromium, no GPU)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/render_flow.mjs | tee e2e_render.txt
          grep -q "SUMMARY 5/5 render steps passed" e2e_render.txt
      - name: Pilot flow
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/pilot_flow.mjs | tee e2e.txt
          grep -q "SUMMARY 10/10 steps passed" e2e.txt
      - name: Rights declaration flow (L-04, enforcement on)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/rights_flow.mjs | tee e2e_rights.txt
          grep -q "SUMMARY 6/6 rights steps passed" e2e_rights.txt
      - name: Try-on generation start screen (R-026, mock provider)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/generation_flow.mjs | tee e2e_generation.txt
          grep -q "SUMMARY 10/10 generation steps passed" e2e_generation.txt
      - name: Default asset library screen and pickers (R-033)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/library_flow.mjs | tee e2e_library.txt
          grep -q "SUMMARY 7/7 library steps passed" e2e_library.txt
      - name: Deletion grace and purge on a temporary stack
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/purge_flow.mjs | tee e2e_purge.txt
          grep -q "SUMMARY 5/5 purge steps passed" e2e_purge.txt
      - name: Review decisions (change request, approve, reject)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/review_flow.mjs | tee e2e_review.txt
          grep -q "SUMMARY 4/4 review steps passed" e2e_review.txt
      - name: Photo steps panel (R-044 A-3)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/photo_steps_flow.mjs | tee e2e_photo_steps.txt
          grep -q "SUMMARY 9/9 photo-steps steps passed" e2e_photo_steps.txt
      - name: 3D Studio, viewing (R-038)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/threed_flow.mjs | tee e2e_threed.txt
          grep -q "SUMMARY 6/6 three-d steps passed" e2e_threed.txt
      - name: Brand model profiles (R-039)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/character_flow.mjs | tee e2e_character.txt
          grep -q "SUMMARY 5/5 character steps passed" e2e_character.txt
      - name: Expired login asks again on top of the screen (R-030 A)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/session_flow.mjs | tee e2e_session.txt
          grep -q "SUMMARY 3/3 session steps passed" e2e_session.txt
      - name: Korean error messages for 503, 429 and a lost connection (R-030 B)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/errors_flow.mjs | tee e2e_errors.txt
          grep -q "SUMMARY 5/5 error message steps passed" e2e_errors.txt
      - name: Roles, workspace isolation and mobile width
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/roles_flow.mjs | tee e2e_roles.txt
          grep -q "SUMMARY 6/6 role scenarios passed" e2e_roles.txt
      - name: AI generated disclosure on provider outputs (L-07)
        if: matrix.group == 'a'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/disclosure_flow.mjs | tee e2e_disclosure.txt
          grep -q "SUMMARY 5/5 disclosure steps passed" e2e_disclosure.txt
      - name: Responsive layout, no sideways scrolling (360-1280 px)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/layout_flow.mjs | tee e2e_layout.txt
          grep -q "SUMMARY 13/13 layout checks passed" e2e_layout.txt
      - name: A real browser plays the MP4 the video module makes (Lane 4)
        if: matrix.group == 'b'
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          (cd ai_creator_studio_backend_starter && python scripts/make_sample_mp4.py "$RUNNER_TEMP/sample.mp4")
          cd ai_creator_studio_3d_viewer
          node e2e/video_playback.mjs "$RUNNER_TEMP/sample.mp4" | tee e2e_video_playback.txt
          grep -q "SUMMARY 4/4 video playback checks passed" e2e_video_playback.txt
      - name: 3D rotation cuts become a rotating-object MP4 that a real browser plays (Lane 4 / E-08b)
        if: matrix.group == 'b'
        run: |
          set -o pipefail
          python ai_creator_studio_backend_starter/scripts/make_sample_glb.py "$RUNNER_TEMP/glb"
          node ai_creator_studio_3d_viewer/scripts/render_glb.mjs --glb "$RUNNER_TEMP/glb/sphere_lo.glb" --out "$RUNNER_TEMP/turn" --size 512 --angles 1 --turntable 120 | tail -n 1
          python ai_creator_studio_backend_starter/scripts/turntable_mp4.py "$RUNNER_TEMP/turn" "$RUNNER_TEMP/turn.mp4" 9:16 5 | tee ai_creator_studio_3d_viewer/turntable_report.txt
          grep -q '"cuts": 120' ai_creator_studio_3d_viewer/turntable_report.txt && grep -q '"blended_frames": 0' ai_creator_studio_3d_viewer/turntable_report.txt
          node ai_creator_studio_3d_viewer/scripts/render_glb.mjs --glb "$RUNNER_TEMP/glb/sphere_lo.glb" --out "$RUNNER_TEMP/turn360" --size 512 --angles 1 --turntable 360 | tail -n 1
          /usr/bin/time -f "turntable_15s wall=%es max_rss_kb=%M" python ai_creator_studio_backend_starter/scripts/turntable_mp4.py "$RUNNER_TEMP/turn360" "$RUNNER_TEMP/turn360.mp4" 9:16 15 2>&1 | tee ai_creator_studio_3d_viewer/turntable360_report.txt
          grep -q '"cuts": 360' ai_creator_studio_3d_viewer/turntable360_report.txt && grep -q '"blended_frames": 0' ai_creator_studio_3d_viewer/turntable360_report.txt && grep -q '"qc_passed": true' ai_creator_studio_3d_viewer/turntable360_report.txt
          node ai_creator_studio_3d_viewer/scripts/render_glb.mjs --glb "$RUNNER_TEMP/glb/sphere_lo.glb" --out "$RUNNER_TEMP/turn1280" --size 1280 --angles 1 --turntable 120 | tail -n 1 | tee ai_creator_studio_3d_viewer/turntable1280_render.txt
          /usr/bin/time -f "turntable_1280_5s wall=%es max_rss_kb=%M" python ai_creator_studio_backend_starter/scripts/turntable_mp4.py "$RUNNER_TEMP/turn1280" "$RUNNER_TEMP/turn1280.mp4" 9:16 5 2>&1 | tee ai_creator_studio_3d_viewer/turntable1280_report.txt
          grep -q '"cut_size": \[1280, 1280\]' ai_creator_studio_3d_viewer/turntable1280_report.txt && grep -q '"blended_frames": 0' ai_creator_studio_3d_viewer/turntable1280_report.txt && grep -q '"qc_passed": true' ai_creator_studio_3d_viewer/turntable1280_report.txt
          cd ai_creator_studio_3d_viewer
          node e2e/video_playback.mjs "$RUNNER_TEMP/turn.mp4" 720 1280 5 | tee e2e_turntable_playback.txt
          grep -q "SUMMARY 4/4 video playback checks passed" e2e_turntable_playback.txt
      - name: The fitted garment shell on the mannequin renders from all sides and becomes a rotating MP4 (R-ENGINE-04)
        if: matrix.group == 'b'
        run: |
          set -o pipefail
          python ai_creator_studio_backend_starter/scripts/make_fitted_glb.py "$RUNNER_TEMP/fit" M | tee ai_creator_studio_3d_viewer/fitted_glb.txt
          node ai_creator_studio_3d_viewer/scripts/render_glb.mjs --glb "$RUNNER_TEMP/fit/fitted_M.glb" --out "$RUNNER_TEMP/fitturn" --size 512 --angles 1 --turntable 120 | tail -n 1
          python ai_creator_studio_backend_starter/scripts/check_fitted_render.py "$RUNNER_TEMP/fitturn" 120 | tee ai_creator_studio_3d_viewer/fitted_render_check.txt
          grep -q '"ok": true' ai_creator_studio_3d_viewer/fitted_render_check.txt
          python ai_creator_studio_backend_starter/scripts/turntable_mp4.py "$RUNNER_TEMP/fitturn" "$RUNNER_TEMP/fitturn.mp4" 9:16 5 | tee ai_creator_studio_3d_viewer/fitted_turntable_report.txt
          grep -q '"cuts": 120' ai_creator_studio_3d_viewer/fitted_turntable_report.txt && grep -q '"blended_frames": 0' ai_creator_studio_3d_viewer/fitted_turntable_report.txt && grep -q '"qc_passed": true' ai_creator_studio_3d_viewer/fitted_turntable_report.txt
          cd ai_creator_studio_3d_viewer
          node e2e/video_playback.mjs "$RUNNER_TEMP/fitturn.mp4" 720 1280 5 | tee e2e_fitted_playback.txt
          grep -q "SUMMARY 4/4 video playback checks passed" e2e_fitted_playback.txt
      - name: own3d mock path - start, status, fitted .glb, server-side render, picture check (R-ENGINE-07)
        if: matrix.group == 'b'
        run: |
          set -o pipefail
          python ai_creator_studio_backend_starter/scripts/own3d_path.py make "$RUNNER_TEMP/own3d" | tee ai_creator_studio_3d_viewer/own3d_path_make.txt
          grep -q '"ok": true' ai_creator_studio_3d_viewer/own3d_path_make.txt
          node ai_creator_studio_3d_viewer/scripts/render_glb.mjs --glb "$RUNNER_TEMP/own3d/own3d.glb" --out "$RUNNER_TEMP/own3d/turn" --size 512 --angles 1 --turntable 120 | tail -n 1
          python ai_creator_studio_backend_starter/scripts/own3d_path.py check "$RUNNER_TEMP/own3d/turn" 120 | tee ai_creator_studio_3d_viewer/own3d_path_check.txt
          grep -q '"ok": true' ai_creator_studio_3d_viewer/own3d_path_check.txt
      - name: Legal acceptance gate, AI-training consent and deletion requests in the browser
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          mkdir -p e2e_screens
          E2E_SCREENSHOT_DIR=e2e_screens node e2e/legal_flow.mjs | tee e2e_legal.txt
          grep -q "SUMMARY 8/8 legal screen steps passed" e2e_legal.txt
      - name: Keep the legal modal screenshots (looked at by hand, not asserted)
        if: always() && matrix.group == 'b'
        uses: actions/upload-artifact@v4
        with:
          name: legal-modal-screens
          path: ai_creator_studio_3d_viewer/e2e_screens
          if-no-files-found: ignore
          retention-days: 7
      - name: Base human models - front, 45 degree and side cuts for the eyes (R-ENGINE-08)
        if: matrix.group == 'b'
        run: |
          set -o pipefail
          for sex in male female; do
            node ai_creator_studio_3d_viewer/scripts/render_glb.mjs --glb design_assets/base_models/base_$sex.glb --out "$RUNNER_TEMP/base_cuts/$sex" --size 640 --angles 8 --elevation 5 | tail -n 1
          done
          test "$(ls "$RUNNER_TEMP"/base_cuts/male/*.png | wc -l)" -eq 8 && test "$(ls "$RUNNER_TEMP"/base_cuts/female/*.png | wc -l)" -eq 8
          mkdir -p base_cuts && cp -r "$RUNNER_TEMP"/base_cuts/. base_cuts/
      - name: Keep the base model cuts (angle_000 = front, angle_001 = 45 degrees, angle_002 = side; looked at by hand, not asserted)
        if: always() && matrix.group == 'b'
        uses: actions/upload-artifact@v4
        with:
          name: base-model-cuts
          path: base_cuts
          if-no-files-found: ignore
          retention-days: 14
      - name: Account and data-protection API flows (legal, deletion requests, Character guard)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        run: |
          set -o pipefail
          node e2e/account_flow.mjs | tee e2e_account.txt
          grep -q "SUMMARY 4/4 account flow steps passed" e2e_account.txt
      - name: UI audit report (R-030, prints findings, never fails the build)
        if: matrix.group == 'b'
        working-directory: ai_creator_studio_3d_viewer
        continue-on-error: true
        run: |
          node e2e/audit_flow.mjs | tee audit_report.txt
      - name: Keep the e2e logs for the release evidence page (R-031)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-e2e-${{ matrix.group }}
          path: ai_creator_studio_3d_viewer/e2e*.txt
          if-no-files-found: ignore
          retention-days: 14

  evidence:
    # R-031: one Markdown page with the commit, the counts from the three jobs and the launch flags. Reads logs only.
    needs: [backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: evidence_logs
          merge-multiple: true
      - name: Build the evidence page
        run: |
          python ai_creator_studio_backend_starter/scripts/release_evidence.py --logs-dir evidence_logs --commit "$GITHUB_SHA" --out release_evidence.md
          cat release_evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release_evidence.md
          retention-days: 30
