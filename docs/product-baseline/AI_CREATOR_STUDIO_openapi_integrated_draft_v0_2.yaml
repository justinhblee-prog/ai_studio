          default: true
        preserve_garment_details:
          type: boolean
          default: true
        output_count:
          type: integer
          minimum: 1
          maximum: 10
    PhotoInput:
      type: object
      required:
      - source_asset_id
      - operation
      properties:
        source_asset_id:
          $ref: '#/components/schemas/Identifier'
        operation:
          type: string
          enum:
          - ENHANCE
          - BACKGROUND
          - LIGHTING
          - RETOUCH
          - COMPOSE
