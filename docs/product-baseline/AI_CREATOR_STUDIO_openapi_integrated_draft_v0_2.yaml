          - string
          - 'null'
        brand_profile_id:
          type:
          - string
          - 'null'
        routing:
          $ref: '#/components/schemas/RoutingRequest'
        feature_input:
          oneOf:
          - $ref: '#/components/schemas/TryOnInput'
          - $ref: '#/components/schemas/PhotoInput'
          - $ref: '#/components/schemas/LookbookInput'
          description: Feature-specific input. LOOKBOOK schema is a draft and requires product review.
    JobStatus:
      type: string
      enum:
      - QUEUED
      - RESERVED
      - RUNNING
      - CANCEL_REQUESTED
      - SUCCEEDED
      - FAILED
      - CANCELED
      - REQUIRES_RECONCILIATION
    GenerationJob:
      type: object
      required:
      - id
      - workspace_id
      - feature_code
      - status
      - created_at
