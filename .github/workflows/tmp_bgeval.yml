name: tmp-bgeval
on:
  push:
    branches: [l3-bg-removal]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow==13.0.0 || pip install "Pillow>=13,<14"
      - working-directory: ai_creator_studio_backend_starter
        run: python scripts/bg_eval.py
